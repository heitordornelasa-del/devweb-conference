<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Página de login</title>
</head>

<body>

    <nav>

<a href="index.html">Voltar para o evento</a>

    </nav>

    <main> 

<section id="inscricao">
    <h2>Faça o login</h2>

    <p>
        Preencha seus dados abaixo para realizar o login.
    </p>

    <form>

        <fieldset> 
            <legend>Informações de login</legend>

        <p>
            <label for="nome">Nome:</label>

            <input
                type="text"
                id="nome"
                name="nome"
                required
            >
        </p>

        <p>
            <label for="email">E-mail:</label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </p>

        <p>
            <label for="senha">Digite sua senha:</label>

            <input
                type="password"
                id="senha"
                name="senha"
                required
            >
        </p>

        <button type="submit">
            Realizar login
        </button>

        </fieldset>
    </form>
</section>

    </main>

</body>

</html>
